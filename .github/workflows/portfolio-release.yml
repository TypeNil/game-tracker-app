name: GameTracker Portfolio Release

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: portfolio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    name: Require commit reachable from main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

  publish-demo:
    name: Build Demo APK & Publish GitHub Release
    needs: verify-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify & Assemble Demo Debug APK
        run: |
          ./gradlew \
            :app:detekt \
            :app:testDemoDebugUnitTest \
            :app:assembleDemoDebug \
            --stacktrace
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/demo/debug/app-demo-debug.apk "GameTracker-${GITHUB_REF_NAME}-demo.apk"

      - name: Create or update draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="GameTracker-${TAG}-demo.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating draft..."
            gh release edit "$TAG" \
              --draft \
              --title "GameTracker $TAG — Portfolio Release" \
              --notes-file CHANGELOG.md
          else
            echo "Creating new draft release $TAG..."
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "GameTracker $TAG — Portfolio Release" \
              --notes-file CHANGELOG.md
          fi

          test -f art/walkthrough.gif

          echo "Uploading $APK and walkthrough.gif..."
          gh release upload "$TAG" "$APK" "art/walkthrough.gif" --clobber

          echo "Verifying uploaded assets..."
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK" <<< "$ASSETS"
          grep -Fxq "walkthrough.gif" <<< "$ASSETS"

          echo "Publishing release (undrafting)..."
          gh release edit "$TAG" --draft=false
