name: GameTracker Portfolio Release

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: portfolio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    name: Require commit reachable from main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require tag commit reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

  publish-demo:
    name: Build signed Demo Release APK & Publish GitHub Release
    needs: verify-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Restore demo keystore
        env:
          DEMO_KEYSTORE_B64: ${{ secrets.DEMO_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEMO_KEYSTORE_B64" ]; then
            echo "::error::DEMO_KEYSTORE_B64 is missing. See docs/DEMO_RELEASE_SIGNING.md"
            exit 1
          fi
          printf '%s' "$DEMO_KEYSTORE_B64" \
            | base64 --decode > "$RUNNER_TEMP/demo-release.jks"
          test -s "$RUNNER_TEMP/demo-release.jks"

      - name: Verify & Assemble signed Demo Release APK
        env:
          DEMO_KEYSTORE_PATH: ${{ runner.temp }}/demo-release.jks
          DEMO_KEY_ALIAS: ${{ secrets.DEMO_KEY_ALIAS }}
          DEMO_KEY_PASSWORD: ${{ secrets.DEMO_KEY_PASSWORD }}
          DEMO_STORE_PASSWORD: ${{ secrets.DEMO_STORE_PASSWORD }}
        run: |
          ./gradlew \
            :app:detekt \
            :app:testDemoDebugUnitTest \
            :app:assembleDemoRelease \
            --stacktrace

      - name: Verify signature, package, R8 mapping, and SHA-256
        env:
          EXPECTED_CERT_SHA256: ${{ vars.DEMO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/demo/release"
          APK="$(find "$APK_DIR" -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s app/build/outputs/mapping/demoRelease/mapping.txt

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ACTUAL="$(
            "$APKSIGNER" verify --print-certs "$APK" |
              sed -n 's/.*certificate SHA-256 digest: //p' |
              head -n 1 |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]'
          )"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$EXPECTED" ]; then
            echo "::error::DEMO_CERT_SHA256 repository variable is missing. See docs/DEMO_RELEASE_SIGNING.md"
            exit 1
          fi
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not parse certificate SHA-256 from apksigner --print-certs"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::demoRelease signer certificate SHA-256 does not match DEMO_CERT_SHA256"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='io.github.typenil.gametracker.demo'"
          if echo "$BADGING" | grep -Fq "application-debuggable"; then
            echo "::error::$APK is debuggable"
            exit 1
          fi

          TAG="$GITHUB_REF_NAME"
          RELEASE_APK="GameTracker-${TAG}-demo.apk"
          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | tee "${RELEASE_APK}.sha256"

      - name: Extract changelog section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              print(f"::error::Expected tag ref like v1.0.2, got {tag!r}")
              sys.exit(1)
          version = tag[1:]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n.*?(?=^## \[|\Z)"
          match = re.search(pattern, text)
          if not match:
              print(f"::error::CHANGELOG.md has no '## [{version}]' section")
              sys.exit(1)
          notes = re.sub(r"(?s)\n+---\s*$", "", match.group(0)).strip() + "\n"
          heading = notes.splitlines()[0]
          if f"## [{version}]" not in heading:
              print("::error::Extracted notes do not start with the version heading")
              sys.exit(1)
          if "## [Unreleased]" in notes:
              print("::error::Extracted notes include [Unreleased]")
              sys.exit(1)
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Create or update draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="GameTracker-${TAG}-demo.apk"
          CHECKSUM="${APK}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating draft..."
            gh release edit "$TAG" \
              --draft \
              --title "GameTracker $TAG — Portfolio Release" \
              --notes-file release-notes.md
          else
            echo "Creating new draft release $TAG..."
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "GameTracker $TAG — Portfolio Release" \
              --notes-file release-notes.md
          fi

          test -f art/walkthrough.gif
          test -f "$APK"
          test -f "$CHECKSUM"

          echo "Uploading $APK, checksum, and walkthrough.gif..."
          gh release upload "$TAG" "$APK" "$CHECKSUM" "art/walkthrough.gif" --clobber

          echo "Verifying uploaded assets..."
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK" <<< "$ASSETS"
          grep -Fxq "$CHECKSUM" <<< "$ASSETS"
          grep -Fxq "walkthrough.gif" <<< "$ASSETS"

          echo "Publishing release (undrafting)..."
          gh release edit "$TAG" --draft=false

      - name: Remove demo keystore material
        if: always()
        run: rm -f "$RUNNER_TEMP/demo-release.jks"
