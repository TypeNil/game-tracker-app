name: GameTracker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt & KtLint Code Quality Checks
        run: ./gradlew detekt --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDemoDebugUnitTest --stacktrace

      - name: Assemble Demo Debug APK
        run: ./gradlew assembleDemoDebug --stacktrace

      - name: Upload Detekt Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            **/build/reports/detekt/
            **/build/reports/tests/
